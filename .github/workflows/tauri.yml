#Tauri 版桌面程序的三平台构建；macOS 只能在 macOS 上构建（需要 Xcode 的 SDK / codesign / hdiutil）。
# 产物：mac 通用（arm64+x86_64）.app.zip + .dmg（ad-hoc 签名、未公证）；Windows NSIS 安装包 + 单文件便携 exe；Linux deb + AppImage。
# 手动触发（workflow_dispatch）或打 tauri-v* 标签时运行；只上传为 Actions 产物，不发布 Release。
name: tauri
on:
  workflow_dispatch:
  push:
    tags: ['tauri-v*']

env:
  VSIX: ms-ceintl.vscode-language-pack-zh-hans-1.128.0.vsix

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: '--target universal-apple-darwin --bundles app,dmg', rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
          - { os: windows-latest, args: '--bundles nsis', rust_targets: '' }
          - { os: ubuntu-22.04, args: '--bundles deb,appimage', rust_targets: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.rust_targets }}' }
      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - name: 离线语言包（嵌进程序；拿不到也能构建，运行时再下载）
        shell: bash
        run: mkdir -p vendor && curl -fsSL -o "vendor/$VSIX" "https://open-vsx.org/api/MS-CEINTL/vscode-language-pack-zh-hans/1.128.0/file/MS-CEINTL.vscode-language-pack-zh-hans-1.128.0.vsix" || true
      - run: npm ci
      # 单元测试用 POSIX 工具模拟安装树（sh 助手、/proc、pkexec），Windows runner 上跑不了；ci.yml 已在 ubuntu 上跑全量，macOS 会跳过 Linux 专属用例
      - run: npm test
        if: runner.os != 'Windows'
      - name: 构建
        working-directory: apps/tauri
        run: npx tauri build ${{ matrix.args }}
      - name: 收集产物
        shell: bash
        run: |
          B=apps/tauri/src-tauri/target
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            M=$B/universal-apple-darwin/release/bundle
            codesign --verify --deep --verbose=2 "$M"/macos/*.app || true
            (cd "$M/macos" && ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/out/cursor-zh-0.2.3-mac-universal.app.zip")
            cp "$M"/dmg/*.dmg out/cursor-zh-0.2.3-mac-universal.dmg
          elif [ "$RUNNER_OS" = Windows ]; then
            cp $B/release/bundle/nsis/*-setup.exe out/cursor-zh-0.2.3-win-x64-setup.exe
            cp $B/release/cursor-zh.exe out/cursor-zh-0.2.3-win-x64-portable.exe
          else
            cp $B/release/bundle/deb/*.deb out/cursor-zh-0.2.3-linux-amd64.deb
            cp $B/release/bundle/appimage/*.AppImage out/cursor-zh-0.2.3-linux-x86_64.AppImage
          fi
          # Windows 的 Git Bash 没有 shasum，优先用 sha256sum
          (cd out && if command -v sha256sum >/dev/null; then sha256sum *; else shasum -a 256 *; fi | tee SHA256SUMS-${{ runner.os }}.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ runner.os }}
          path: out/*
